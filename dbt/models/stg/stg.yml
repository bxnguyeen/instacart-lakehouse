version: 2

models:
  - name: stg_aisles
    columns:
      - name: aisle_id
        data_tests:
          - not_null
          - unique

      - name: aisle_name
        data_tests:
          - not_null

  - name: stg_departments
    columns:
      - name: department_id
        data_tests:
          - not_null
          - unique

      - name: department
        data_tests:
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: aisle_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_aisles')
                field: aisle_id

      - name: department_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id

  - name: stg_orders
    description: "Current orders accumulated from raw batches."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: user_id
        data_tests:
          - not_null

      - name: _batch_id
        data_tests:
          - not_null

  - name: stg_order_products_prior
    description: "Current order products accumulated from raw batches."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: add_to_cart_order
        data_tests:
          - not_null

      - name: reordered
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: _batch_id
        data_tests:
          - not_null

  - name: stg_order_products_train
    description: "Current order products accumulated from raw batches."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: add_to_cart_order
        data_tests:
          - not_null

      - name: reordered
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: _batch_id
        data_tests:
          - not_null
