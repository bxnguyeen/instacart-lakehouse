name: instacart-lakehouse

services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: instacart-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakehouse
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  
  nessie:
    image: ghcr.io/projectnessie/nessie:0.101.3
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /tmp/nessie-rocksdb-store
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:19120:19120"
    volumes:
      - nessie_data:/tmp

  trino:
    image: trinodb/trino:483
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
    depends_on:
      - minio
      - nessie
    mem_limit: 3g

volumes:
  minio_data:
  nessie_data: